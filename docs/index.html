async function enableResourceCache(){

 try{
  await navigator.serviceWorker.register('cache-worker.js',{updateViaCache:'none'});

function choices(id,items){const select=document.querySelector('#'+id);select.innerHTML='';const initial=document.createElement('option');initial.value='';initial.textContent='当前默认';initial.disabled=true;select.append(initial);for(const item of items||[]){const option=document.createElement('option');option.value=item.value;option.textContent=item.label;select.append(option);}select.disabled=!items?.length;select.onchange=()=>{if(select.value!=='')garageSend(id==='paint'?'SetPaint':id==='interior'?'SetInterior':'SetWheel',select.value);};}
window.addEventListener('deepal-state',event=>{
 if(event.detail.name!=='vehicle')return;const state=event.detail.state;const loading=document.querySelector('#vehicle-loading');loading.hidden=!state.loading;document.querySelector('#vehicle').disabled=!!state.loading;loading.textContent='正在加载 '+(state.label||'车型')+' · '+Math.round((state.progress||0)*100)+'%';document.querySelector('.controls').setAttribute('aria-busy',String(!!state.loading));
 if(state.error){document.querySelector('#error').textContent=state.error;return;}
 if(state.loading||!state.paint)return;
 if(!document.documentElement.dataset.modelStartupMs)document.documentElement.dataset.modelStartupMs=String(Math.round(performance.now()-pageLoadStarted));
 document.querySelector('#error').textContent='';document.querySelector('#vehicle').value=state.id;
 if(currentModel!==state.id){currentModel=state.id;document.querySelector('h1').textContent='深蓝 '+state.label;document.querySelector('#unity-canvas').setAttribute('aria-label','Unity 渲染的 '+state.label+' 原始资源，拖动旋转，滚轮缩放');localStorage.setItem('deepal-garage-model',state.id);choices('paint',state.paint);choices('interior',state.interior);choices('wheels',state.wheels);document.querySelectorAll('[data-door],[data-window],#trunk,#light,#flash,#rain,#snow').forEach(button=>button.setAttribute('aria-pressed','false'));document.querySelector('#view').value='default';document.querySelector('#weather').disabled=false;document.body.dataset.view='default';document.querySelector('#air-controls').hidden=true;document.querySelector('#charge-controls').hidden=true;const seats=document.querySelector('#seat-index');seats.innerHTML='';for(const [index,label] of [[0,'方向盘'],[1,'左前座椅'],[2,'右前座椅'],[3,state.sixSeats?'第二排左侧':'左后座椅'],[4,state.sixSeats?'第二排右侧':'右后座椅'],...(state.sixSeats?[[5,'第三排左侧'],[6,'第三排右侧']]:[])]){const option=document.createElement('option');option.value=String(index);option.textContent=label;seats.append(option);}seats.value='1';window.dispatchEvent(new Event('deepal-model-ready'));}
 const extras=document.querySelector('#extras');extras.innerHTML='';for(const item of state.extras||[]){const button=document.createElement('button');button.textContent=item.label;button.disabled=!!item.disabled;if(item.disabled)button.title='此资源版本没有可用运动部件';button.setAttribute('aria-pressed',String(item.state>.5));button.onclick=()=>garageSend('SetExtra',item.value);extras.append(button);}
});
</script></body></html>
